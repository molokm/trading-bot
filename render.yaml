services:
  - type: web
    name: trading-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # PORT is set by Render; entrypoint uses PORT first
      - key: BACKEND_PORT
        value: "10000"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: OKX_DEMO
        value: "true"
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RISK_KILL_SWITCH
        sync: false
      - key: RISK_MAX_DAILY_LOSS_USD
        sync: false
      - key: RISK_MAX_POSITION_USD
        sync: false
      - key: RISK_MAX_LEVERAGE
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      # Pro plan (Telegram Stars). The paid "Signals" plan and the public
      # /tracker page are retired — removed SIGNAL_* / TRACKER_URL keys.
      - key: PRO_PRICE_STARS
        value: "500"
      - key: PRO_PLAN_DAYS
        value: "30"
      # ── Daily trend portfolio (paper-only, read-only) ──────────────────
      # The book itself cannot place an order: it only reads public daily
      # candles.  Enabled here to build a forward paper track record.
      # Target profile chosen 2026-11-14: BTC 200-day regime gate ON, risk
      # 0.64 per 1/45 sleeve (= 1.42% of the account per trade) → backtest
      # ~+19.5% CAGR at ~22% maxDD.  Set TREND_PORTFOLIO_ENABLE=0 to stop it.
      - key: TREND_PORTFOLIO_ENABLE
        value: "1"
      - key: TREND_PORTFOLIO_REGIME
        value: "BTC"
      - key: TREND_PORTFOLIO_REGIME_MA
        value: "200"
      - key: TREND_PORTFOLIO_RISK
        value: "0.64"
      # Venue for the daily bars.  The 5.5y validation was measured on
      # UTC-bucketed Binance days; OKX buckets 1D on UTC+8 and the same rules
      # score 14% CAGR / Sharpe 0.57 there vs 24% / 0.85 on Binance over
      # 2023-08→2026-11.  Falls back to OKX automatically if Binance is
      # unreachable from this region.
      - key: TREND_PORTFOLIO_SOURCE
        value: "binance"
