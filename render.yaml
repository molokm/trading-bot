services:
  - type: web
    name: trading-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BACKEND_PORT
        value: "8000"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: OKX_DEMO
        value: "true"
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RISK_KILL_SWITCH
        sync: false
      - key: RISK_MAX_DAILY_LOSS_USD
        sync: false
      - key: RISK_MAX_POSITION_USD
        sync: false
      - key: RISK_MAX_LEVERAGE
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: SIGNAL_PRICE_STARS
        value: "100"
      - key: SIGNAL_PLAN_DAYS
        value: "30"
      - key: SIGNAL_INVITE_DAYS
        value: "3"
      - key: PRO_PRICE_STARS
        value: "500"
      - key: PRO_PLAN_DAYS
        value: "30"
      - key: TRACKER_URL
        value: "https://trading-bot-mu99.onrender.com/tracker"
