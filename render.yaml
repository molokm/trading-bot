services:
  - type: web
    name: trading-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # PORT is set by Render; entrypoint uses PORT first
      - key: BACKEND_PORT
        value: "10000"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: OKX_DEMO
        value: "true"
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RISK_KILL_SWITCH
        sync: false
      - key: RISK_MAX_DAILY_LOSS_USD
        sync: false
      - key: RISK_MAX_POSITION_USD
        sync: false
      - key: RISK_MAX_LEVERAGE
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      # Pro plan (Telegram Stars). The paid "Signals" plan and the public
      # /tracker page are retired — removed SIGNAL_* / TRACKER_URL keys.
      - key: PRO_PRICE_STARS
        value: "500"
      - key: PRO_PLAN_DAYS
        value: "30"
