app = "trading-bot-backend"

[build]
  dockerfile = "Dockerfile"

[env]
  OKX_DEMO = "true"
  BACKEND_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "tradingbot_data"
  destination = "/app/app/data"
